name: Flutter Debug

on:
  push:
    branches:
      - main

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.2'
          channel: stable

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Check Flutter Version
        run: flutter --version

      - name: List Project Files
        run: ls -la
